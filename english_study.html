<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 단어 공부장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #070710;
    --surface: #0e0e18;
    --border: #1e1e2e;
    --text: #f0ede8;
    --muted: #555;
    --gold: #c9a96e;
    --blue: #60a5fa;
    --green: #4ade80;
    --red: #f87171;
    --purple: #a78bfa;
    --yellow: #fbbf24;
    --pink: #f472b6;
  }
  html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  button { cursor: pointer; transition: all .18s; border: none; font-family: inherit; }
  button:active { opacity: .75; transform: scale(.97); }
  input { font-family: inherit; }

/* ─── LAYOUT ─────────────────────────────── */
#app { max-width: 500px; margin: 0 auto; padding: 28px 16px 80px; }

/* ─── HEADER ─────────────────────────────── */
.header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
.header-left .label { font-size: 10px; letter-spacing: 4px; color: #333; text-transform: uppercase; margin-bottom: 4px; }
.header-left h1 { font-family: ‘DM Serif Display’, serif; font-size: 28px; font-weight: 400; letter-spacing: -.5px; }
.nav-btns { display: flex; gap: 8px; }
.nav-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid #1a1a25; background: transparent; color: #333; font-size: 13px; }
.nav-btn.active { border-color: #3a3a55; background: #1a1a2e; color: #a0a0cc; }

/* ─── CARDS ──────────────────────────────── */
.card { background: var(–surface); border: 1px solid var(–border); border-radius: 20px; padding: 24px; margin-bottom: 16px; }

/* ─── TAGS ───────────────────────────────── */
.tag { font-size: 10px; padding: 2px 9px; border-radius: 20px; display: inline-block; }
.tag-표현 { background: rgba(96,165,250,.13); color: #60a5fa; }
.tag-단어 { background: rgba(251,191,36,.13); color: #fbbf24; }
.tag-문법 { background: rgba(167,139,250,.13); color: #a78bfa; }
.tag-비즈니스 { background: rgba(52,211,153,.1); color: #34d399; }
.tag-일상 { background: rgba(244,114,182,.1); color: #f472b6; }
.tag-둘다 { background: rgba(148,163,184,.1); color: #94a3b8; }

/* ─── PROGRESS BAR ───────────────────────── */
.progress-track { height: 2px; background: #111120; border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #60a5fa, #a78bfa); border-radius: 2px; transition: width .4s; }

/* ─── FLASHCARD ──────────────────────────── */
.card-scene { perspective: 1200px; height: 280px; margin-bottom: 16px; cursor: pointer; }
.card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); }
.card-inner.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; overflow: hidden; border: 1px solid var(–border); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 32px; }
.card-front { background: var(–surface); }
.card-back { background: #080810; transform: rotateY(180deg); align-items: flex-start; justify-content: center; }
.card-hint { font-size: 11px; color: #2e2e40; letter-spacing: 2px; margin-top: 16px; }
.card-word { font-family: ‘DM Serif Display’, serif; font-size: 24px; text-align: center; line-height: 1.4; }
.card-back-label { font-family: ‘DM Serif Display’, serif; font-size: 12px; color: #333; font-style: italic; margin-bottom: 8px; }
.card-meaning { font-size: 19px; font-weight: 500; color: var(–gold); line-height: 1.5; margin-bottom: 20px; }
.card-example { border-top: 1px solid #1a1a28; padding-top: 16px; width: 100%; }
.card-example-en { font-family: ‘DM Serif Display’, serif; font-size: 14px; color: #bbb; font-style: italic; line-height: 1.8; margin-bottom: 6px; }
.card-example-kr { font-size: 12px; color: var(–muted); line-height: 1.6; }
.card-tags { position: absolute; top: 14px; left: 14px; display: flex; gap: 6px; }
.card-known { position: absolute; top: 14px; right: 14px; color: var(–green); font-size: 16px; }

/* ─── ACTION BUTTONS ─────────────────────── */
.action-row { display: flex; gap: 10px; }
.btn-review { flex: 1; padding: 14px 0; border-radius: 12px; border: 1px solid #2a1515; background: #150a0a; color: var(–red); font-size: 14px; font-weight: 500; }
.btn-known  { flex: 1; padding: 14px 0; border-radius: 12px; border: 1px solid #152515; background: #0a150a; color: var(–green); font-size: 14px; font-weight: 500; }
.btn-skip   { width: 100%; margin-top: 10px; padding: 11px; border-radius: 12px; border: 1px solid #141420; background: transparent; color: #2e2e42; font-size: 13px; }
.btn-primary { width: 100%; padding: 15px; border-radius: 14px; background: linear-gradient(135deg,#1a3a2a,#1a2a3a); color: var(–green); font-size: 15px; font-weight: 600; border: none; }
.btn-primary:disabled { background: #1a1a22; color: #444; cursor: default; }
.btn-secondary { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(–border); background: transparent; color: var(–muted); font-size: 14px; }
.btn-outline { padding: 7px 16px; border-radius: 20px; border: 1px solid #1e2e3e; background: #1a2030; color: var(–blue); font-size: 13px; }

/* ─── CALENDAR ───────────────────────────── */
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.cal-nav { padding: 4px 12px; border-radius: 8px; border: 1px solid var(–border); background: transparent; color: var(–muted); font-size: 18px; }
.cal-month { font-size: 14px; color: #ccc; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-day-label { text-align: center; font-size: 10px; color: #444; padding: 2px 0; }
.cal-day { aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent; background: transparent; color: #3a3a4a; font-size: 12px; position: relative; display: flex; align-items: center; justify-content: center; cursor: default; }
.cal-day.has-study { color: var(–green); cursor: pointer; background: #1a2a1a; }
.cal-day.is-today { color: var(–text); border-color: #3a3a52; cursor: pointer; }
.cal-day.is-selected { border-color: var(–blue); background: rgba(96,165,250,.13); }
.cal-dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(–green); }

/* ─── WORD LIST ───────────────────────────── */
.word-item { background: var(–surface); border: 1px solid var(–border); border-radius: 14px; padding: 14px 18px; cursor: pointer; transition: border-color .2s; margin-bottom: 10px; }
.word-item.open { border-color: #3a3a52; }
.word-item-header { display: flex; justify-content: space-between; align-items: center; }
.word-item-front { font-family: ‘DM Serif Display’, serif; font-size: 16px; color: var(–text); }
.word-item-body { margin-top: 12px; padding-top: 12px; border-top: 1px solid #1a1a28; }
.word-item-meaning { font-size: 15px; color: var(–gold); margin-bottom: 10px; }
.word-item-example { font-family: ‘DM Serif Display’, serif; font-size: 13px; color: #888; font-style: italic; line-height: 1.7; }
.word-item-exampleKR { font-size: 12px; color: var(–muted); margin-top: 4px; }

/* ─── SETUP ──────────────────────────────── */
.setup-box { padding: 40px 0; text-align: center; }
.setup-icon { font-size: 48px; margin-bottom: 16px; }
.setup-title { font-family: ‘DM Serif Display’, serif; font-size: 22px; margin-bottom: 8px; }
.setup-desc { font-size: 13px; color: var(–muted); line-height: 1.7; margin-bottom: 28px; }
.setup-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(–border); background: var(–surface); color: var(–text); font-size: 14px; margin-bottom: 12px; outline: none; }
.setup-input:focus { border-color: #3a3a55; }
.setup-note { font-size: 11px; color: #444; margin-top: 12px; line-height: 1.7; }

/* ─── MISC ───────────────────────────────── */
.section-label { font-size: 11px; color: #333; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
.error-box { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: #200a0a; border: 1px solid #3a1515; font-size: 12px; color: var(–red); line-height: 1.6; }
.done-box { text-align: center; padding: 60px 0; }
.history-item { background: var(–surface); border: 1px solid #1a1a25; border-radius: 14px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.history-date { font-size: 14px; color: #aaa; }
.history-progress { font-size: 12px; color: rgba(74,222,128,.47); }
.history-btns { display: flex; gap: 8px; }
.history-btn { padding: 7px 14px; border-radius: 10px; border: 1px solid; background: transparent; font-size: 12px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; border-top-color: var(–green); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>

</head>
<body>
<div id="app"></div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const TAUGHT = ["call it","mirror","attribute A to B","pull ahead","move the needle","take flight","in the gutter","on its face","have no business doing","do a full 180","be in over one's head","I'll give them that","let's see how it plays out","step aside","hold back","consistent with","for cause","push back on","as early as","at the helm of","if were to","should have","would have been","get+pp","elimination","severance","velocity","restructuring","peers","pivot","rebrand","improbable","enthusiasm","lease","independence","successor","confirmation","ramp up","probe","cut to the chase","get the ball rolling","touch base","bear with me","on the same page","wrap up","hang tight","no-brainer","run it by someone","it's not a big deal","bandwidth","capacity","initiative","overwhelmed","give someone the benefit of the doubt"];

const TODAY = new Date();
const toKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY_KEY = toKey(TODAY);

const SYSTEM_PROMPT = `You are an American English teacher for Korean adult working professionals.
Generate exactly 15 English expressions/words for daily study. Mix:
- 5 casual/everyday expressions native Americans actually say
- 5 business/workplace expressions
- 5 useful vocabulary words

NEVER repeat: ${TAUGHT.join(', ')}

Return ONLY a valid JSON array of 15 objects. No markdown, no explanation.
Each object: {"front":"expression","back":"Korean meaning (concise)","example":"Natural English sentence","exampleKR":"Korean translation","tag":"표현" or "단어" or "문법","context":"비즈니스" or "일상" or "둘다"}`;

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const S = {
  get: (k, fb=null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  keys: () => { try { return Object.keys(localStorage).filter(k=>k.startsWith('eng_day_')).map(k=>k.replace('eng_day_','')); } catch { return []; } }
};
const loadDay   = k => S.get('eng_day_'+k);
const saveDay   = (k,v) => S.set('eng_day_'+k, v);
const loadKnown = k => new Set(S.get('eng_known_'+k, []));
const saveKnown = (k,s) => S.set('eng_known_'+k, [...s]);
const getApiKey = () => localStorage.getItem('eng_api_key') || '';
const setApiKey = k => localStorage.setItem('eng_api_key', k);
const getAllTaught = () => S.get('eng_taught', []);
const addTaught = words => S.set('eng_taught', [...new Set([...getAllTaught(), ...words.map(w=>w.front)])]);

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const shuffle = a => [...a].sort(()=>Math.random()-.5);
const h = (tag, attrs={}, ...children) => {
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el[k] = v;
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return el;
};
const div = (cls, ...ch) => h('div', {class:cls}, ...ch);
const btn = (cls, text, onclick) => { const b = h('button', {class:cls}, text); b.onclick = onclick; return b; };
const span = (cls, text) => h('span', {class:cls}, text);

// ─── API CALL ─────────────────────────────────────────────────────────────────
async function generateWords() {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error('API 키가 없어요. 설정에서 입력해 주세요.');
  
  const allTaught = [...TAUGHT, ...getAllTaught()].join(', ');
  const systemPrompt = SYSTEM_PROMPT.replace(TAUGHT.join(', '), allTaught);

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 2000,
      system: systemPrompt,
      messages: [{ role: 'user', content: 'Generate today\'s 15 English study items. Return ONLY the JSON array.' }]
    })
  });

  const data = await res.json();
  if (data.error) throw new Error('API 오류: ' + (data.error.message || JSON.stringify(data.error)));
  if (!res.ok) throw new Error('HTTP 오류: ' + res.status);

  const raw = (data.content?.find(b => b.type === 'text')?.text || '').trim();
  const start = raw.indexOf('['), end = raw.lastIndexOf(']');
  if (start === -1 || end === -1) throw new Error('응답에서 단어 목록을 찾지 못했어요.');

  const words = JSON.parse(raw.slice(start, end+1));
  if (!Array.isArray(words) || words.length < 5) throw new Error('생성된 단어가 부족해요.');
  return words;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  view: getApiKey() ? 'home' : 'setup',   // setup | home | flashcard | list | calendar | done
  selectedKey: TODAY_KEY,
  todayWords: loadDay(TODAY_KEY),
  studiedKeys: S.keys(),
  loading: false,
  error: null,
  deck: [],
  deckIdx: 0,
  known: loadKnown(TODAY_KEY),
  openWordIdx: null,
  calYear: TODAY.getFullYear(),
  calMonth: TODAY.getMonth(),
  apiKeyDraft: '',
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
async function doGenerate() {
  setState({ loading: true, error: null });
  try {
    const words = await generateWords();
    saveDay(TODAY_KEY, words);
    addTaught(words);
    const deck = shuffle(words);
    setState({ todayWords: words, studiedKeys: S.keys(), deck, deckIdx: 0, known: new Set(), loading: false, view: 'flashcard', selectedKey: TODAY_KEY });
  } catch(e) {
    setState({ loading: false, error: e.message || String(e) });
  }
}

function doStartFlashcard(key) {
  const words = key === TODAY_KEY ? state.todayWords : loadDay(key);
  if (!words) return;
  const known = loadKnown(key);
  setState({ selectedKey: key, deck: shuffle(words), deckIdx: 0, known, view: 'flashcard' });
}

function doMarkKnown() {
  const card = state.deck[state.deckIdx];
  if (!card) return;
  const known = new Set([...state.known, card.front]);
  saveKnown(state.selectedKey, known);
  if (state.deckIdx + 1 >= state.deck.length) setState({ known, view: 'done' });
  else setState({ known, deckIdx: state.deckIdx + 1 });
}

function doMarkReview() {
  const known = new Set([...state.known].filter(x => x !== state.deck[state.deckIdx]?.front));
  saveKnown(state.selectedKey, known);
  if (state.deckIdx + 1 >= state.deck.length) setState({ known, view: 'done' });
  else setState({ known, deckIdx: state.deckIdx + 1 });
}

function doNextCard() {
  if (state.deckIdx + 1 >= state.deck.length) setState({ view: 'done' });
  else setState({ deckIdx: state.deckIdx + 1 });
}

function doSaveKey() {
  const k = state.apiKeyDraft.trim();
  if (!k) return;
  setApiKey(k);
  setState({ view: 'home', apiKeyDraft: '' });
}

// ─── RENDER PIECES ────────────────────────────────────────────────────────────
function renderTags(word) {
  const wrap = div('');
  wrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;';
  if (word.tag) wrap.appendChild(span('tag tag-'+word.tag, word.tag));
  if (word.context) wrap.appendChild(span('tag tag-'+word.context, word.context));
  return wrap;
}

let flipState = {};
function renderFlashcard(card, isKnown) {
  const key = card.front;
  if (!flipState[key]) flipState[key] = false;

  const scene = div('card-scene');
  const inner = div('card-inner' + (flipState[key] ? ' flipped' : ''));

  // Front
  const front = div('card-face card-front');
  const tagsWrap = div('card-tags');
  tagsWrap.appendChild(renderTags(card));
  front.appendChild(tagsWrap);
  if (isKnown) front.appendChild(span('card-known', '✓'));
  front.appendChild(span('card-word', card.front));
  front.appendChild(span('card-hint', 'TAP TO FLIP'));

  // Back
  const back = div('card-face card-back');
  const backTags = div('card-tags');
  backTags.appendChild(renderTags(card));
  back.appendChild(backTags);
  back.appendChild(span('card-back-label', card.front));
  back.appendChild(span('card-meaning', card.back));
  const ex = div('card-example');
  ex.appendChild(h('div', {class:'card-example-en'}, '"' + card.example + '"'));
  ex.appendChild(h('div', {class:'card-example-kr'}, card.exampleKR));
  back.appendChild(ex);

  scene.onclick = () => { flipState[key] = !flipState[key]; render(); };
  inner.appendChild(front);
  inner.appendChild(back);
  scene.appendChild(inner);
  return scene;
}

function renderCalendar() {
  const { calYear, calMonth, studiedKeys, selectedKey } = state;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = new Date(calYear, calMonth).toLocaleString('ko-KR', { month:'long', year:'numeric' });

  const wrap = div('card');
  const header = div('cal-header');
  const prev = btn('cal-nav', '‹', () => {
    if (calMonth === 0) setState({ calYear: calYear-1, calMonth: 11 });
    else setState({ calMonth: calMonth-1 });
  });
  const next = btn('cal-nav', '›', () => {
    if (calMonth === 11) setState({ calYear: calYear+1, calMonth: 0 });
    else setState({ calMonth: calMonth+1 });
  });
  header.appendChild(prev);
  header.appendChild(span('cal-month', monthName));
  header.appendChild(next);
  wrap.appendChild(header);

  const grid = div('cal-grid');
  ['일','월','화','수','목','금','토'].forEach(d => {
    grid.appendChild(h('div', {class:'cal-day-label'}, d));
  });
  for (let i=0; i<firstDay; i++) grid.appendChild(div(''));
  for (let d=1; d<=daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasStudy = studiedKeys.includes(key);
    const isToday = key === TODAY_KEY;
    const isSelected = key === selectedKey;
    let cls = 'cal-day';
    if (hasStudy) cls += ' has-study';
    if (isToday) cls += ' is-today';
    if (isSelected) cls += ' is-selected';
    const cell = h('div', {class: cls}, String(d));
    if (hasStudy && isSelected === false) {
      const dot = div('cal-dot'); cell.appendChild(dot);
    }
    if (hasStudy || isToday) {
      cell.style.cursor = 'pointer';
      cell.onclick = () => setState({ selectedKey: key });
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}

function renderWordList(words, dateKey) {
  const { openWordIdx } = state;
  const label = dateKey === TODAY_KEY ? '오늘' : dateKey;
  const wrap = div('');
  wrap.appendChild(h('div', {style:'font-size:13px;color:#555;margin-bottom:16px;'}, label + ' · ' + words.length + '개'));
  words.forEach((w, i) => {
    const item = div('word-item' + (openWordIdx === i ? ' open' : ''));
    const header = div('word-item-header');
    header.appendChild(span('word-item-front', w.front));
    const tagWrap = div(''); tagWrap.style.display='flex'; tagWrap.style.gap='6px';
    if (w.tag) tagWrap.appendChild(span('tag tag-'+w.tag, w.tag));
    if (w.context) tagWrap.appendChild(span('tag tag-'+w.context, w.context));
    header.appendChild(tagWrap);
    item.appendChild(header);
    if (openWordIdx === i) {
      const body = div('word-item-body');
      body.appendChild(h('div', {class:'word-item-meaning'}, w.back));
      body.appendChild(h('div', {class:'word-item-example'}, '"' + w.example + '"'));
      body.appendChild(h('div', {class:'word-item-exampleKR'}, w.exampleKR));
      item.appendChild(body);
    }
    item.onclick = () => setState({ openWordIdx: openWordIdx === i ? null : i });
    wrap.appendChild(item);
  });
  return wrap;
}

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────
function render() {
  const { view, todayWords, loading, error, deck, deckIdx, known, studiedKeys, selectedKey, apiKeyDraft } = state;
  const root = document.getElementById('app');
  root.innerHTML = '';

  // Header
  const header = div('header');
  const left = div('header-left');
  left.appendChild(h('div', {class:'label'}, 'Daily English'));
  left.appendChild(h('h1', {}, '단어 공부장'));
  header.appendChild(left);

  if (view !== 'setup') {
    const navBtns = div('nav-btns');
    [['home','🏠'],['calendar','📅']].forEach(([v,label]) => {
      const b = btn('nav-btn' + (view===v?' active':''), label, () => setState({view:v}));
      navBtns.appendChild(b);
    });
    // settings
    const settingsBtn = btn('nav-btn', '⚙️', () => setState({view:'setup', apiKeyDraft: getApiKey()}));
    navBtns.appendChild(settingsBtn);
    header.appendChild(navBtns);
  }
  root.appendChild(header);

  // ── SETUP ────────────────────────────────────────────────
  if (view === 'setup') {
    const box = div('setup-box');
    box.appendChild(h('div', {class:'setup-icon'}, '🔑'));
    box.appendChild(h('div', {class:'setup-title'}, 'API 키 설정'));
    box.appendChild(h('div', {class:'setup-desc'}, 'Anthropic API 키를 입력하면\n매일 AI가 새 단어 15개를 생성해줘요.\n키는 이 기기에만 저장되며 외부로 전송되지 않아요.'));
    const input = h('input', {class:'setup-input', type:'password', placeholder:'sk-ant-...'});
    input.value = apiKeyDraft || getApiKey();
    input.oninput = e => { state.apiKeyDraft = e.target.value; };
    box.appendChild(input);
    const saveBtn = btn('btn-primary', '저장하고 시작하기', doSaveKey);
    box.appendChild(saveBtn);
    box.appendChild(h('div', {class:'setup-note'}, '🔒 API 키는 브라우저 로컬에만 저장되며\n서버로 전송되거나 공유되지 않아요.\nAPI 키는 console.anthropic.com에서 발급받을 수 있어요.'));
    root.appendChild(box);
    return;
  }

  // ── HOME ─────────────────────────────────────────────────
  if (view === 'home') {
    const todayCard = div('card');
    const dateLabel = h('div', {style:'font-size:11px;color:#444;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;'}, 'TODAY');
    const dateText = h('div', {style:'font-family:"DM Serif Display",serif;font-size:18px;margin-bottom:6px;'}, TODAY.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'}));
    todayCard.appendChild(dateLabel);
    todayCard.appendChild(dateText);

    if (todayWords) {
      const countText = h('div', {style:'font-size:13px;color:#4ade80;margin-bottom:20px;'}, '✓ ' + todayWords.length + '개 준비됨');
      todayCard.appendChild(countText);
      const row = div('action-row');
      const flashBtn = btn('', '🃏 플래시카드', () => doStartFlashcard(TODAY_KEY));
      flashBtn.style.cssText = 'flex:2;padding:13px 0;border-radius:12px;background:linear-gradient(135deg,#1a2a3a,#1a1a2e);color:#60a5fa;font-weight:600;font-size:14px;border:none;cursor:pointer;';
      const listBtn = btn('btn-secondary', '목록', () => setState({view:'list',selectedKey:TODAY_KEY}));
      listBtn.style.cssText += ';flex:1;padding:13px 0;border-radius:12px;';
      row.appendChild(flashBtn);
      row.appendChild(listBtn);
      todayCard.appendChild(row);
    } else {
      const noWords = h('div', {style:'font-size:13px;color:#444;margin-bottom:20px;'}, '오늘의 단어가 아직 없어요');
      todayCard.appendChild(noWords);
      const genBtn = btn('btn-primary', '', doGenerate);
      genBtn.disabled = loading;
      if (loading) {
        const sp = h('span', {class:'spinner'});
        genBtn.appendChild(sp);
        genBtn.appendChild(document.createTextNode('AI가 단어를 만들고 있어요...'));
      } else {
        genBtn.textContent = '✨ 오늘의 15개 단어 생성하기';
      }
      todayCard.appendChild(genBtn);
      if (error) {
        const errBox = h('div', {class:'error-box'}, error);
        todayCard.appendChild(errBox);
      }
    }
    root.appendChild(todayCard);

    // Recent history
    const pastKeys = studiedKeys.filter(k=>k!==TODAY_KEY).sort().reverse().slice(0,5);
    if (pastKeys.length > 0) {
      root.appendChild(h('div', {class:'section-label'}, '최근 복습'));
      pastKeys.forEach(key => {
        const words = loadDay(key);
        const k = loadKnown(key);
        const item = div('history-item');
        const info = div('');
        info.appendChild(h('div', {class:'history-date'}, key));
        info.appendChild(h('div', {class:'history-progress'}, k.size+'/'+(words?.length||0)+' 완료'));
        const btns = div('history-btns');
        const rb = btn('history-btn', '복습', () => doStartFlashcard(key));
        rb.style.cssText = 'border-color:#1e2e1e;color:#4ade80;';
        const lb = btn('history-btn', '목록', () => setState({view:'list',selectedKey:key}));
        lb.style.cssText = 'border-color:#1e1e2e;color:#555;';
        btns.appendChild(rb); btns.appendChild(lb);
        item.appendChild(info); item.appendChild(btns);
        root.appendChild(item);
      });
    }
    return;
  }

  // ── CALENDAR ─────────────────────────────────────────────
  if (view === 'calendar') {
    root.appendChild(renderCalendar());
    if (selectedKey) {
      const box = div('card');
      box.appendChild(h('div', {style:'font-size:13px;color:#666;margin-bottom:14px;'}, selectedKey===TODAY_KEY?'오늘':selectedKey));
      const dayWords = selectedKey===TODAY_KEY ? todayWords : loadDay(selectedKey);
      if (dayWords) {
        const row = div('action-row');
        const fb = btn('', '🃏 플래시카드', () => doStartFlashcard(selectedKey));
        fb.style.cssText = 'flex:2;padding:13px 0;border-radius:12px;background:linear-gradient(135deg,#1a2a3a,#1a1a2e);color:#60a5fa;font-weight:600;font-size:14px;border:none;cursor:pointer;';
        const lb = btn('btn-secondary', '목록', () => setState({view:'list'}));
        lb.style.cssText += ';flex:1;padding:13px 0;border-radius:12px;';
        row.appendChild(fb); row.appendChild(lb);
        box.appendChild(row);
      } else if (selectedKey === TODAY_KEY) {
        const gb = btn('btn-primary', loading?'생성 중...':'✨ 오늘의 단어 생성하기', doGenerate);
        gb.disabled = loading;
        box.appendChild(gb);
      } else {
        box.appendChild(h('div', {style:'font-size:13px;color:#333;'}, '이 날의 단어가 없어요'));
      }
      root.appendChild(box);
    }
    return;
  }

  // ── FLASHCARD ─────────────────────────────────────────────
  if (view === 'flashcard') {
    const topRow = div('action-row');
    topRow.style.marginBottom = '16px';
    const backBtn = btn('nav-btn', '← 홈', () => setState({view:'home'}));
    const listViewBtn = btn('btn-outline', '목록보기', () => setState({view:'list'}));
    topRow.appendChild(backBtn); topRow.appendChild(listViewBtn);
    root.appendChild(topRow);

    const meta = div('');
    meta.style.cssText = 'display:flex;justify-content:space-between;margin-bottom:8px;';
    meta.appendChild(h('span', {style:'font-size:12px;color:#444;'}, (deckIdx+1)+' / '+deck.length));
    const knownCount = deck.filter(w=>known.has(w.front)).length;
    meta.appendChild(h('span', {style:'font-size:12px;color:rgba(74,222,128,.53);'}, '✓ '+knownCount));
    root.appendChild(meta);

    const track = div('progress-track');
    const fill = div('progress-fill');
    fill.style.width = (deck.length ? (deckIdx/deck.length)*100 : 0) + '%';
    track.appendChild(fill);
    root.appendChild(track);

    const card = deck[deckIdx];
    if (card) {
      root.appendChild(renderFlashcard(card, known.has(card.front)));
      const actions = div('action-row');
      actions.appendChild(btn('btn-review', '↩ 복습 필요', doMarkReview));
      actions.appendChild(btn('btn-known', '알아요 ✓', doMarkKnown));
      root.appendChild(actions);
      root.appendChild(btn('btn-skip', '건너뛰기', doNextCard));
    }
    return;
  }

  // ── DONE ──────────────────────────────────────────────────
  if (view === 'done') {
    const knownCount = deck.filter(w=>known.has(w.front)).length;
    const box = div('done-box');
    box.appendChild(h('div', {style:'font-size:48px;margin-bottom:16px;'}, '🎉'));
    box.appendChild(h('div', {style:'font-family:"DM Serif Display",serif;font-size:22px;margin-bottom:8px;'}, '완료!'));
    box.appendChild(h('div', {style:'font-size:14px;color:#555;margin-bottom:36px;'}, '알아요 '+knownCount+' · 복습 필요 '+(deck.length-knownCount)));
    const btnsWrap = div('');
    btnsWrap.style.cssText = 'display:flex;flex-direction:column;gap:12px;';
    if (deck.length - knownCount > 0) {
      const rvBtn = btn('btn-primary', '복습 필요한 '+(deck.length-knownCount)+'개 다시 보기', () => {
        const rv = shuffle(deck.filter(w=>!known.has(w.front)));
        flipState = {};
        setState({deck:rv, deckIdx:0, view:'flashcard'});
      });
      rvBtn.style.background = 'linear-gradient(135deg,#1a2a1a,#1a3a1a)';
      btnsWrap.appendChild(rvBtn);
    }
    btnsWrap.appendChild(btn('btn-secondary', '오늘의 단어 목록 보기', () => setState({view:'list',selectedKey:TODAY_KEY})));
    btnsWrap.appendChild(btn('btn-secondary', '홈으로', () => setState({view:'home'})));
    box.appendChild(btnsWrap);
    root.appendChild(box);
    return;
  }

  // ── LIST ──────────────────────────────────────────────────
  if (view === 'list') {
    const { selectedKey } = state;
    const words = selectedKey===TODAY_KEY ? todayWords : loadDay(selectedKey);
    const topRow = div('action-row');
    topRow.style.marginBottom = '20px';
    topRow.appendChild(btn('nav-btn', '← 홈', () => setState({view:'home'})));
    if (words) topRow.appendChild(btn('btn-outline', '🃏 플래시카드', () => doStartFlashcard(selectedKey)));
    root.appendChild(topRow);
    if (words) root.appendChild(renderWordList(words, selectedKey));
    return;
  }
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
render();
</script>

</body>
</html>
